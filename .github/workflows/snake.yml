name: Generate Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write   # allows pushing files using GITHUB_TOKEN

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Ensure output dir
        run: mkdir -p dist

      # Generate contribution-snake SVG (use pinned version)
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          # replace with the path(s) you want the action to write
          svg_out_path: dist/github-contribution-grid-snake.svg
          # gif_out_path: dist/github-contribution-grid-snake.gif   # optional

      - name: Show generated files (debug)
        run: ls -la dist || true

      # Option A: Use crazy-max gh-pages action to push the dist folder to a branch
      - name: Publish to branch (gh-pages style)
        uses: crazy-max/ghaction-github-pages@v2
        with:
          # Where the action looks for files to publish — must match above
          build_dir: dist
          # target branch where files will be pushed
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Option B: Simple commit & push (alternative to gh-pages action)
      # - name: Commit and push generated files
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
